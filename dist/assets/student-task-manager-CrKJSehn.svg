  <text x="40" y="69" font-size="7" fill="#e2dbff" text-anchor="middle">S</text>
  <text x="54" y="64" font-size="7.5" fill="#eff3fb">Student</text>
  <text x="54" y="74" font-size="6.5" fill="#74829b">logged in</text>
  <g font-size="7.5">
    <rect x="30" y="90" width="84" height="18" rx="3" fill="#8767ff" fill-opacity=".16"/>
