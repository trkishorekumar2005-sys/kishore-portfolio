      <rect x="196" y="5" width="46" height="11" rx="5" fill="#47b7a3" fill-opacity=".18"/><text x="219" y="13" font-size="6.5" fill="#72e1b3" text-anchor="middle">DONE</text>
      <text x="270" y="13" fill="#82a4ff">✎</text><text x="290" y="13" fill="#e66b86">✕</text>
    </g>
    <g transform="translate(138 190)">
      <rect width="310" height="20" rx="3" fill="#ffffff" fill-opacity=".02"/>
      <rect x="8" y="6" width="8" height="8" rx="2" fill="none" stroke="#8767ff"/>
      <text x="24" y="13" fill="#d5dcec">Mini project review</text>
      <rect x="196" y="5" width="46" height="11" rx="5" fill="#8767ff" fill-opacity=".18"/><text x="219" y="13" font-size="6.5" fill="#c9bfff" text-anchor="middle">PENDING</text>
      <text x="270" y="13" fill="#82a4ff">✎</text><text x="290" y="13" fill="#e66b86">✕</text>
    </g>
