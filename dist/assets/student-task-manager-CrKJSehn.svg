    <text x="40" y="126" fill="#8b96aa">✓ My Tasks</text>
    <text x="40" y="146" fill="#8b96aa">◷ Pending</text>
    <text x="40" y="166" fill="#8b96aa">● Completed</text>
    <text x="40" y="208" fill="#5d6880">⏻ Logout</text>
