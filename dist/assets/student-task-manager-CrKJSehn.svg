<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" font-family="'DM Mono', ui-monospace, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17172c"/><stop offset="1" stop-color="#111022"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4d83ff"/><stop offset="1" stop-color="#8767ff"/></linearGradient>
  </defs>
  <rect width="480" height="240" fill="url(#bg)"/>
  <rect x="20" y="42" width="440" height="184" rx="6" fill="#0b0e1c" stroke="#83a7ff" stroke-opacity=".14"/>

  <!-- Sidebar -->
  <rect x="20" y="42" width="104" height="184" rx="6" fill="#0f1224"/>
  <rect x="118" y="42" width="6" height="184" fill="#0f1224"/>
  <line x1="124" y1="42" x2="124" y2="226" stroke="#83a7ff" stroke-opacity=".12"/>
